# Netlify settings for The Practice Library (static site: no build step).
# Security headers are applied to every page and file.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Block other sites from showing these pages inside a frame (clickjacking)
    X-Frame-Options = "DENY"
    # Browsers must trust our declared file types (no MIME sniffing)
    X-Content-Type-Options = "nosniff"
    # HTTPS only, remembered for one year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Send only our domain (not full page paths) to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Turn off device features the site never uses
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")"
    # Only our own files, Google Fonts and (for future checkout buttons) Stripe may load.
    # No inline scripts or inline style attributes are allowed.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
